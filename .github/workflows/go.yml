name: Go

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum

    - name: Install dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libusb-1.0-0-dev libudev-dev

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

    - name: Test on 32-bit x86 (linux/386)
      if: matrix.os == 'ubuntu-latest'
      env:
        GOARCH: "386"
      run: go test ./...

    - name: Build for 32-bit ARM (linux/arm)
      if: matrix.os == 'ubuntu-latest'
      env:
        GOARCH: arm
        GOARM: "7"
      run: go build ./...

    - name: Test certified FIPS 140 policy
      if: matrix.os == 'ubuntu-latest'
      env:
        GOFIPS140: certified
      run: go test -v ./...

    - name: Test certified FIPS 140-only policy
      if: matrix.os == 'ubuntu-latest'
      env:
        GODEBUG: fips140=only
        GOFIPS140: certified
      run: go test -v ./...
